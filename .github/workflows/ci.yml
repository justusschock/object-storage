name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "backend/*/v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every module directory: the root module and the nested backend modules.
  MODULES: ". backend/azure backend/gcs backend/http backend/s3 backend/sftp"

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "oldstable", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: "**/go.sum"
      - name: Verify modules
        run: |
          for module in $MODULES; do
            (cd "$module" && GOWORK=off go mod verify)
          done
      # The nested modules require a released root version. A temporary
      # workspace tests them against the checked-out root instead, so a
      # change to the root contract is tested against every backend.
      - name: Create workspace
        run: go work init $MODULES
      - name: Vet
        run: |
          for module in $MODULES; do
            (cd "$module" && go vet ./... && go vet -tags=integration ./...)
          done
      - name: Test
        run: |
          for module in $MODULES; do
            (cd "$module" && go test -race -count=1 ./...)
          done

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", backend/azure, backend/gcs, backend/http, backend/s3, backend/sftp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - name: Check go.mod and go.sum are tidy
        working-directory: ${{ matrix.module }}
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code go.mod go.sum

  boundaries:
    name: dependency boundary and portability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Root module stays free of cloud and SSH SDKs
        run: |
          if go list -deps ./... | grep -E 'aws-sdk|cloud\.google\.com|azure-sdk-for-go|fsouza|gofakes3|pkg/sftp|x/crypto/ssh'; then
            echo "the root module must not depend on provider SDKs; they belong in backend/* modules"
            exit 1
          fi
      - name: No committed workspace or replace directives
        run: |
          if git ls-files | grep -E '(^|/)go\.work(\.sum)?$'; then exit 1; fi
          if git ls-files -z -- go.mod '*/go.mod' | xargs -0 grep -En '^replace([[:space:]]|$)'; then exit 1; fi
      - name: Create workspace
        run: go work init $MODULES
      - name: Cross-compile portable stores
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64 freebsd/amd64 solaris/amd64 js/wasm; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./backend/fs/...
          done
          for module in backend/sftp backend/http; do
            for target in linux/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
              (cd "$module" && GOOS=${target%/*} GOARCH=${target#*/} go vet ./...)
            done
          done

  # On a release tag, test every module exactly as consumers resolve it:
  # without a workspace, against the root version its go.mod requires.
  release:
    name: release modules
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Test modules as released
        env:
          GOWORK: "off"
        run: |
          for module in $MODULES; do
            (cd "$module" && go mod verify && go vet ./... && go test -count=1 ./...)
          done
