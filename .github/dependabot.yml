version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/backend/azure"
      - "/backend/gcs"
      - "/backend/http"
      - "/backend/s3"
      - "/backend/sftp"
    schedule: { interval: weekly }
    groups:
      go-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
